/* --- dynamic caption box --- */
.captionOverlay {
    position: fixed;
    background: rgba(255, 255, 239, 0.8);
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.25s ease, visibility 0.25s ease;
}

.captionOverlay.open {
  opacity: 1;
    visibility: visible;
    pointer-events: auto;}

.captionBox {
    background: white;
    color: blakck;
    max-width: 480px;
    width: 85%;
    padding: 28px 32px;
    border-radius: 6px;
    box-shadow: 0 30px 30px rgba(255, 255, 239, 0.8);
    cursor: default;
    position: relative;
    font-family: inherit;
}

.captionBox h3 {
    margin: 0 0 10px 0;
    font-size: 1.1em;
}

.captionBox p {
    margin: 0;
    line-height: 1.5;
    font-size: 0.95em;
}

.captionVideo {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    height: 0;
    overflow: hidden;
    border-radius: 4px;
    margin: 0 0 16px 0;
    display: none;
    background: #000;
}

.captionVideo iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.captionClose {
    position: absolute;
    top: 10px;
    left: 14px;
    cursor: pointer;
    font-size: 1.2em;
    color: #aaa;
    background: none;
    border: none;
}

.captionClose:hover {
    color: #fff;
}

.margin[data-caption] {
    cursor: pointer;
}
</style>

        <script>
        (function () {
            var overlay = document.getElementById('captionOverlay');
            var box = document.getElementById('captionBox');
            var titleEl = document.getElementById('captionTitle');
            var textEl = document.getElementById('captionText');
            var videoEl = document.getElementById('captionVideo');
            var closeBtn = document.getElementById('captionClose');

            function openCaption(title, text, videoId) {
                titleEl.textContent = title || '';
                textEl.textContent = text || '';

                if (videoId) {
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://www.youtube.com/embed/' + videoId;
                    iframe.title = title || '';
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                    iframe.allowFullscreen = true;
                    videoEl.innerHTML = '';
                    videoEl.appendChild(iframe);
                    videoEl.style.display = 'block';
                } else {
                    videoEl.innerHTML = '';
                    videoEl.style.display = 'none';
                }

                overlay.classList.add('open');
            }

            function closeCaption() {
                overlay.classList.remove('open');
                // stop playback by clearing the iframe once the box has faded out
                setTimeout(function () {
                    if (!overlay.classList.contains('open')) {
                        videoEl.innerHTML = '';
                    }
                }, 250);
            }

            document.querySelectorAll('.margin[data-caption]').forEach(function (el) {
                el.addEventListener('click', function (e) {
                    e.stopPropagation();
                    openCaption(
                        el.getAttribute('data-caption'),
                        el.getAttribute('data-caption-text'),
                        el.getAttribute('data-video')
                    );
                });
            });

            // click outside the box closes it; click inside the box does not
            overlay.addEventListener('click', closeCaption);
            box.addEventListener('click', function (e) { e.stopPropagation(); });
            closeBtn.addEventListener('click', closeCaption);

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeCaption();
            });
        })();
    </script>
