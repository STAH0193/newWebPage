<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width">
    <title>***</title>

    <link rel="stylesheet" href="css/stylesheetFour.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/addons/p5.sound.js"></script>

  </head>
<body>

    <style>
      #modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(252, 255, 189, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        transition: opacity 1.5s ease;
        pointer-events: none;
      }
      #modal-overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #modal-box {
        background: #fff;
        color: #111;
        max-width: 90%;
        width: 400px;
        padding: 24px;
        border-radius: 8px;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        font-family: sans-serif;
      }
      #modal-close {
        position: absolute;
        top: 10px;
        right: 14px;
        background: none;
        border: none;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        color: #333;
      }
      #modal-close:hover {
        color: #000;
      }
      #modal-box h2 {
        margin-top: 0;
      }
      #modal-ok {
        margin-top: 16px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background: #333;
        color: #fff;
        cursor: pointer;
      }
      #modal-ok:hover {
        background: #000;
      }
    </style>
  </head>
<body>
 
<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close" aria-label="Close">&times;</button>
    <h2>Indigo</h2>
    <p>Indigo is a open audio visual web page developed using the Web Audio API and P5 JS library. Programmed by Mitch Stahlmann 2020. </p>
    <button id="modal-ok">OK</button>
  </div>
</div>
 
<script>
  (function () {
    var overlay = document.getElementById('modal-overlay');
 
    function openModal() {
      // allow initial styles to apply before adding the class,
      // so the transition actually animates
      requestAnimationFrame(function () {
        overlay.classList.add('visible');
      });
    }
 
    function closeModal() {
      overlay.classList.remove('visible');
    }
 
    window.addEventListener('load', openModal);
 
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-ok').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  })();
</script> 

  </head>
<body>
 
<div id="modal-overlay">
  <div id="modal-box">
    <button id="modal-close" aria-label="Close">&times;</button>
    <h2>Welcome</h2>
    <p>This is your modal message. Edit this text to say whatever you'd like.</p>
    <button id="modal-ok">OK</button>
  </div>
</div>
 
<script>
  (function () {
    var overlay = document.getElementById('modal-overlay');
    function closeModal() {
      overlay.classList.add('hidden');
    }
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-ok').addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  })();
</script>

<div id="blue-box"></div>

  </body>
</html>
